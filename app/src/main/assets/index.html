<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d101c"><title>J2OS</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wallpaper"></div>
<main class="home">
  <header><span class="eyebrow">J2OS • HOME</span><span id="date"></span></header>
  <section class="clock"><div id="time">--:--</div><div class="greeting" id="greeting">A little space for everything.</div></section>
  <section class="quick" id="quickApps" aria-label="Favorite apps"></section>
  <div class="dock" id="dock"></div>
  <button class="drawer-handle" onclick="openDrawer()" aria-label="Open app drawer"><span></span><small>Swipe up · All apps</small></button>
</main>
<section class="drawer" id="drawer">
  <div class="drawer-top"><button onclick="closeDrawer()">Close</button><strong>All apps</strong><span id="appCount"></span></div>
  <input id="search" type="search" placeholder="Search apps…" oninput="renderApps()">
  <div class="app-grid" id="appGrid"></div>
</section>
<script src="app.js"></script>
</body></html>
